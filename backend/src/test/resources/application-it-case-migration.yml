# Rung-4 registry for CaseMigrationIT (issue #500, INSTANCE-MIGRATION.md §7.3).
#
# The it-findings registry plus a prod twin of engine-7, so the typed confirmation of the three
# Flowable 7.x case-migration doors (typed running count, typed ended count, typed case id) is
# proven against the real 7.1 engine. Its own profile, not a fourth entry in it-findings: Spring
# does not merge lists across profiles, and a fourth engine there would widen the fan-out of
# MigrationFindingsIT and BulkMigrationIT for no reason.
#
#   engine-a      — flowable-rest 6.8 (:8081), dev/read-write
#   engine-a-prod — the SAME 6.8 engine tagged prod
#   engine-7      — flowable-rest 7.1 (:8083), dev/read-write
#   engine-7-prod — the SAME 7.1 engine tagged prod
inspector:
  registry:
    source: config
  fanout-parallelism: 4
  engines:
    - id: engine-a
      name: "Engine A (findings harness, Flowable 6.8)"
      base-url: "http://localhost:${PI_ENGINE_A_PORT:8081}/flowable-rest/service"
      environment: dev
      accent-color: "#2e86de"
      enabled: true
      mode: read-write
      audit-payload: full
      auth:
        type: basic
        username: rest-admin
        password-ref: ENGINE_A_PASSWORD
      timeouts:
        connect-ms: 2000
        read-ms: 10000
        write-ms: 10000
      max-page-size: 10
      dlq-scan-cap: 500

    - id: engine-a-prod
      name: "Engine A (prod twin)"
      base-url: "http://localhost:${PI_ENGINE_A_PORT:8081}/flowable-rest/service"
      environment: prod
      accent-color: "#e74c3c"
      enabled: true
      mode: read-write
      audit-payload: full
      auth:
        type: basic
        username: rest-admin
        password-ref: ENGINE_A_PASSWORD
      timeouts:
        connect-ms: 2000
        read-ms: 10000
        write-ms: 10000
      max-page-size: 10
      dlq-scan-cap: 500

    - id: engine-7
      name: "Engine 7 (findings harness, Flowable 7.1)"
      base-url: "http://localhost:${PI_ENGINE_7_PORT:8083}/flowable-rest/service"
      environment: dev
      accent-color: "#8e44ad"
      enabled: true
      mode: read-write
      audit-payload: full
      auth:
        type: basic
        username: rest-admin
        password-ref: ENGINE_7_PASSWORD
      timeouts:
        connect-ms: 2000
        read-ms: 10000
        write-ms: 10000
      max-page-size: 10
      dlq-scan-cap: 500

    - id: engine-7-prod
      name: "Engine 7 (prod twin)"
      base-url: "http://localhost:${PI_ENGINE_7_PORT:8083}/flowable-rest/service"
      environment: prod
      accent-color: "#c0392b"
      enabled: true
      mode: read-write
      audit-payload: full
      auth:
        type: basic
        username: rest-admin
        password-ref: ENGINE_7_PASSWORD
      timeouts:
        connect-ms: 2000
        read-ms: 10000
        write-ms: 10000
      max-page-size: 10
      dlq-scan-cap: 500
