server:
  port: 8085
  servlet:
    session:
      # Idle cap (R-SAFE-07): a session dies after 12h of inactivity. The ABSOLUTE cap (24h,
      # regardless of activity) is AbsoluteSessionTimeoutFilter — see inspector.security.http.
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
        # `secure` deliberately left container-derived: Secure over HTTPS (prod behind the proxy),
        # not on plain-HTTP local dev — hard-coding true would break the dev login over http.

# R-AUD-04 (usability W1#6): every log line carries the request's correlation id — the same
# value as the X-Request-Id response header and the audit row's correlation_id (RequestIdFilter
# binds it to MDC). Boot's default console/file patterns include this correlation slot.
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

# Observability (IMPROVEMENT-PLAN P1 #12 / Q1, OPERATIONS §8). `/actuator/health/**` is permitAll
# in SecurityConfig for the container/k8s liveness+readiness probes; `/actuator/prometheus` stays
# behind `.anyRequest().authenticated()` — an auth-gated scrape endpoint (OPERATIONS §8), so a
# Prometheus scraper authenticates like any other caller. Only these three endpoints are exposed.
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - info
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/{liveness,readiness}
      show-details: when-authorized
      # `db` is an OPTIONAL readiness member: present with a real DataSource (demo/prod), absent in
      # the docker-free engine-only test profiles (DataSource autoconfig excluded). Turn off
      # membership validation so those contexts still boot — the group then resolves to whatever
      # exists (readinessState-only there, readinessState+db where Postgres is wired).
      validate-group-membership: false
      group:
        # Readiness gates on the audit DB: a BFF that cannot reach its own Postgres must not be
        # routed traffic (mutations would fail-closed anyway).
        readiness:
          include:
            - readinessState
            - db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: process-inspector

spring:
  threads:
    virtual:
      enabled: true   # SPEC §10: blocking style on virtual threads, no WebFlux

  # M4: the BFF-owned Postgres (audit log, notes, protected instances) — the compose
  # `postgres` profile on :5433 for dev. Password via env ref only (iron rule); the
  # default matches the dev compose container.
  datasource:
    url: ${INSPECTOR_DB_URL:jdbc:postgresql://localhost:5433/inspector}
    username: ${INSPECTOR_DB_USER:inspector}
    password: ${INSPECTOR_DB_PASSWORD:inspector}
    hikari:
      # OPERATIONS §6: pool sized explicitly. connection-timeout kept short so the
      # fail-closed audit refusal (R-AUD-01) answers in seconds, not Hikari's 30s default.
      maximum-pool-size: 20
      connection-timeout: 3000
  jpa:
    # Schema comes from Flyway ONLY (V1__init.sql) — validate in EVERY profile.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      # audit_entry is a partitioned table; without this the validator does not see
      # PG "PARTITIONED TABLE" relations and validate would fail on a correct schema.
      hibernate.hbm2ddl.extra_physical_table_types: PARTITIONED TABLE

# R-SEM-15: deterministic OpenAPI output — sorted keys + stable pretty-printing so the
# committed frontend/src/api/schema.d.ts only diffs when the API surface changes.
springdoc:
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

# Shared circuit-breaker config; the client creates one instance PER ENGINE ID so a sick
# engine fast-fails alone (do-no-harm, ARCHITECTURE §2.2). wait-duration < probe period
# (30s) so the scheduled health probe drives half-open recovery.
resilience4j:
  circuitbreaker:
    configs:
      engine:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          # Capability probes expect 404s on old engines — they must never trip a breaker.
          - org.springframework.web.client.HttpClientErrorException
      # v2/M4 snapshot sampler's OWN breaker (instances keyed "{id}:sampler") so a failing
      # background poll trips independently of the interactive breaker — same failure model.
      sampler:
        base-config: engine
      # v2 deep-paging's OWN breaker (instances keyed "{id}:deep-page", R-NFR-08): an
      # offset-near-cap query failing/timing out trips independently of interactive search.
      deep-page:
        base-config: engine
  # Do-no-harm companion to the breaker (ARCH §2.2): caps concurrent in-flight calls PER
  # ENGINE so the search plans' parallel enrichment legs queue instead of flooding an
  # engine that is typically already under load when this tool is open.
  bulkhead:
    configs:
      engine:
        max-concurrent-calls: 8
        max-wait-duration: 20s
      # The v2/M4 snapshot sampler's THIN lane (PLAN v2/M4): a periodic trend poll gets its
      # own small per-engine permit share so it can never starve an interactive search of the
      # 8 interactive permits. Short wait — a contended sample is skipped, not queued long.
      sampler:
        max-concurrent-calls: 2
        max-wait-duration: 5s
      # v2 deep-paging's THIN lane (R-NFR-08): a heavy offset-near-cap fan-out gets its own small
      # per-engine permit share so a scroller (or a crafted-cursor flood) can never starve the 8
      # interactive permits. Short wait — a contended deep page degrades, never queues long.
      deep-page:
        max-concurrent-calls: 2
        max-wait-duration: 5s

inspector:
  # Transport/header/session posture (IDP-SECURITY.md §8, R-OPS-16). All defaults are safe; shown
  # here for legibility. CSP now ENFORCES (S5): the report-only observation window is over and the
  # permissive-but-real policy held against the bpmn-js/AG-Grid/CodeMirror bundle. A deploy mid
  # bundle-change can set csp-report-only:true to re-observe. TIGHTENING the still-permissive
  # 'unsafe-inline'/'unsafe-eval' directives is the tracked follow-up. HSTS stays OFF here (the
  # reverse proxy owns Strict-Transport-Security — never double-emit).
  security:
    http:
      csp-report-only: false
      hsts-enabled: false
      session-absolute-cap-hours: 24
  # At most this many engines searched concurrently per fan-out (R-NFR-01 caps at 10).
  fanout-parallelism: 8
  # superProcessInstanceId chain-walk bound for the failed-in-subprocess roll-up (ARCH §2.3).
  hierarchy-max-depth: 10
  # Stage 0 triage landing (SPEC §4): aggregation cache TTL (thundering-herd protection),
  # Refresh-bypass throttle, the cap on representative stacktrace fetches per round, and
  # the R-BAU-01 acknowledge auto-resurface threshold (an acknowledged group resurfaces
  # once its member count grows past the acknowledged baseline by this percentage).
  triage:
    cache-ttl-s: 20
    refresh-min-interval-s: 10
    # Representative stacktrace fetches per round. DISPLAY refinement only (resolves the
    # root-cause class shown on a card); since algo v2 it can never change a group's identity
    # hash, so tuning this trades label quality — never grouping stability (#270).
    stacktrace-sample-cap: 25
    ack-resurface-threshold-pct: 20
    # R1 cost-aware attention ordering (docs/ALARM-COST-MODEL.md, #348 design / #353 build).
    # DEFAULT FALSE and deliberately so: the §7 data-maturity gate is measured NOT MET (0 of 5
    # axes — 0 closed episodes, max 2 concurrent live classes, 0 acks ever, and 14.8d of RECORDED
    # ledger span of which only 0.12d was TRUSTED: the pilot's history was 99% blind
    # (cycle_complete = false) until 2026-08-04T15:39Z — the instant an unreachable engine left
    # the aggregation scope, NOT the instant it became reachable (§14.2 correction).
    # G5 counts trusted span — a fit-plus-holdout over discarded deltas is a
    # fit over nothing — so earliest satisfaction is ≈ 2026-09-29, correcting the ≈ 2026-09-14
    # stated here before the #365 amendment round re-measured it). Since #372 the trusted span is
    # also CURRENT-ERA only: `incident_occurrence.fleet` (V22) records the pass's observation
    # SCOPE beside the two quality markers, and a fit must difference within ONE fleet, so a
    # registry composition change opens a new era. Pre-V22 rows carry '' (unrecorded, comparable
    # to nothing), which restarts the clock at V22 deploy — deliberately, since scope at write
    # time cannot be reconstructed and guessing it would be fabrication. Replaying A(c) over all 21,229
    # recorded pilot buckets reproduced today's count-only ordering EXACTLY (Kendall tau = 1.0,
    # zero position changes). Off ⇒ nothing is computed, no `attention` block is served, and the
    # card order is byte-for-byte `total DESC`. Flip it only alongside a re-measurement of §7.
    attention-ordering: false
    attention:
      # The R factor's half-life. 24h ON PURPOSE — the same constant as
      # inspector.incidents.quiet-window, so "stops being fresh" means one thing to an operator.
      recency-half-life: PT24H
      arrivals-window-days: 28
      # The M factor's own sample-size floor: below 3 closed episodes the class has no MTTR and
      # renders "no resolve-time history" — never a number (§6 estimation honesty rails).
      min-closed-episodes: 3
      mttr-clamp-low: 0.5
      mttr-clamp-high: 2.0
      # INERT AT THIS VALUE, deliberately kept (#400 part A). The "demoted at most 4x, never
      # zeroed" guarantee is LANE QUANTISATION arithmetic — S bottoms out at 1 - p_heal(LIKELY)
      # = 1 - 0.75 = 0.25 — so every value <= 0.25 is selected by nothing and changes no score
      # by a single bit (measured bit-identical across 30 700 simulated fleets,
      # docs/reviews/R-ATTENTION-HARM-2026-08.md §6). It is NOT deleted because a value STRICTLY
      # ABOVE 0.25 does bind and weakens demotion — the real deployment lever — and because it
      # stays the guard if S is ever fed a rate above 0.75 directly.
      self-heal-floor: 0.25
      # The S factor's heal horizon tau_heal, w = 2^(-t_heal / tau_heal) (#400 part B, §4.1b): a
      # class that heals within the hour is demoted about as hard as today, one that heals in
      # eight keeps 99.6 % of its score. A POLICY constant, not an estimate — deliberately NOT
      # recency-half-life (at 24h an 8h heal still keeps 79 % of its demotion, i.e. exactly the
      # regime measured at 80.73 % harm / 0.00 % help) and deliberately NOT derived from medMTTR
      # (endogenous — it contains the operator queue wait this ordering controls, #398). Set it
      # to roughly 4x your own hands-on service time if you know it.
      self-heal-horizon: PT1H
      model-ttl: PT5M
      # C3 (§3.3): the counterfactual-ack-replay-derived auto-resurface threshold. FALSE until
      # the FULL §7 gate passes — G4 alone (≥10 completed ack lifecycles) stands at zero acks
      # ever recorded — so ack-resurface-threshold-pct above stays in force verbatim.
      derived-resurface-threshold: false
      resurface-floor-pct: 10
      resurface-false-budget-per30-ack-days: 1.0
      # Burst-aware F (#365, §4.1a) — dead configuration until attention-ordering is opted into.
      # W = ISA-18.2's own 10-minute flood window (the finest window this sampler's measured 60s
      # cadence honestly supports is 5 min, §14.3, so 10 has margin); onset 10 / exit 5 are
      # ISA-18.2's asymmetric flood onset/end verbatim, giving a two-bin Schmitt trigger whose
      # hold leg needs a GENUINE prior onset (summing the bins would gate 6+6 across 20 minutes
      # as a "flood"). exit MUST be ≤ onset — an inverted pair is refused at binding, not
      # reinterpreted. gamma = 8 weighs one flood-window arrival as eight trickled ones; what is
      # actually bounded is the inflation ceiling 1 + log2(gamma)/log2(1 + onset) ≈ 1.87x, the
      # same order as the M clamp's 2x, so no single factor can dominate the others' full range.
      # Keep W > model-ttl (a shorter W logs a startup WARN): the bins are evaluated at model
      # build time, so a flood must outlive one rebuild to be seen at all.
      burst-window: PT10M
      burst-onset: 10
      burst-exit: 5
      burst-weight: 8.0
  # Bulk fan-out engine-protection knobs (SPEC §7, v1.x #2) + the live bulk-progress SSE
  # stream's guardrails (issue #301): sse-subscriber-cap bounds the emitter registry (beyond
  # it a subscribe completes immediately and the browser degrades to polling); sse-coalesce-ms
  # collapses repeat bulk-job events for the SAME job within the window into one flush.
  bulk:
    engine-permits: 4
    stagger-ms: 250
    circuit-pause-max-ms: 20000
    circuit-pause-poll-ms: 1000
    sse-subscriber-cap: 200
    sse-coalesce-ms: 250
  # v2/M4 job-lane snapshot store (R-BAU-08 trend sparklines): an @Scheduled virtual-thread
  # sampler runs the Stage-0 count aggregation on the thin `sampler` bulkhead and upserts one
  # narrow row per (engine, lane) bucket into triage_snapshot. The UI reads history from
  # Postgres, never the live engine. bucket-width ≥ sample-interval so a normal (non-overlapping)
  # fire always lands in a fresh bucket; a restart/overlap within a bucket upserts idempotently.
  snapshot:
    enabled: true
    sample-interval: 60s
    bucket-width: 60s
    retention-days: 400
  # v2 Incident Ledger (R-BAU-10, docs/INCIDENT-LEDGER.md): persisted failure-class lifecycle,
  # ingested as a pure DB-side consumer of the sampler's AggregationSampledEvent — zero extra
  # engine calls (sampler off ⇒ ledger idle too). quiet-window is the READ-time "quiet"
  # derivation horizon (never stored); regression-min-count is the RESOLVED→REGRESSED gate
  # hysteresis (fires only at/above this live total, after a post-resolve zero/absent cycle);
  # retention-days is the incident_occurrence drop-partition horizon (400d revFADP, aligned
  # with the snapshot store — incident/episode rows persist, they ARE the memory). list-cap
  # (issue #308) is the hard server-side ceiling on GET /api/incidents' bounded (still
  # unpaginated) list — an absent window means the whole ledger up to this cap, never truly
  # unbounded; the response's `truncated` flag says so honestly when it bites.
  incidents:
    enabled: true
    quiet-window: PT24H
    regression-min-count: 1
    retention-days: 400
    list-cap: 500
  # RETRYING risk lane self-heal statistics (RETRYING-RISK-LANE.md, #351, gated on the locked
  # design #347). Pure derive-on-read over the incident ledger's own occurrence + audit stores
  # (zero new engine calls, zero new persistence) — enabled=true only starts the §4.2
  # dwell-ticking listener; GET /api/incidents reads stay live either way and answer the safe
  # INSUFFICIENT_HISTORY default for any class the listener hasn't ticked yet. window-days
  # bounds the scan (≤ the 400d occurrence retention); floor is the §7.1 measured sample-size
  # floor (10 unconfounded completed spells) below which no rate/interval renders; dwell-cycles
  # is the minimum consecutive COMPLETE sampler cycles (~10 min at the 60s beat) a newly
  # computed lane must hold before it becomes the DISPLAYED one. Data-maturity gate (§7.2, pilot
  # ship gate for the RATE DISPLAY — not this computation) is NOT MET as of 2026-08-04
  # (reviews/R2-SELFHEAL-BASELINE-2026-08.md) — every class renders INSUFFICIENT_HISTORY today,
  # by construction of the floor, not because this is disabled.
  selfheal:
    enabled: true
    window-days: 90
    floor: 10
    dwell-cycles: 10
  # Audit golden-master retention (M4-CLOSEOUT §A2 / S5b). retention-days MUST be ≥ 400 — the
  # purge_audit() DB floor refuses any younger cutoff, so a smaller value would never purge.
  # The @Scheduled AuditRetentionPurger drops whole aged-out monthly partitions (one at a time,
  # each chain-checkpointed and audited BEFORE the DROP); disable it with retention-purge.enabled:
  # false (a STOPPED purge is then visible via the missing audit-retention-purge event).
  audit:
    retention-days: 400
    retention-purge:
      enabled: true
  # v2 Registry CRUD (docs/REGISTRY-CRUD.md). source=db (default): DB-authoritative once seeded —
  # an empty engine_registry imports `engines` below as a one-time audited seed, then the DB wins
  # (YAML drift is reported at boot, never silent). source=config pins to config-only (CRUD off,
  # restart semantics). egress-allowlist/egress-ports are the SSRF egress boundary — DEPLOY CONFIG,
  # never editable in-app — consumed by the URL validator when the write/connect path is wired
  # (S3/S4). Dev lists localhost so the demo engines below validate; prod sets a strict list
  # out-of-band and NEVER lists private ranges.
  registry:
    source: db
    egress-allowlist:
      - localhost
      - 127.0.0.0/8
    egress-ports: []
  engines:
    - id: engine-a
      name: "Engine A (demo)"
      # Placeholder-with-default so a container deployment can repoint the host without
      # replacing the whole engines list (indexed env binding would wipe the other fields).
      base-url: "${INSPECTOR_ENGINE_A_BASE_URL:http://localhost:8081/flowable-rest/service}"
      environment: dev
      accent-color: "#2e86de"
      enabled: true
      mode: read-write
      auth:
        type: basic
        username: rest-admin
        password-ref: ENGINE_A_PASSWORD
      timeouts:
        connect-ms: 2000
        read-ms: 10000
        write-ms: 10000
      max-page-size: 200
      dlq-scan-cap: 5000
      alarm-thresholds:
        oldest-job-warn-min: 5
        oldest-job-crit-min: 15
        overdue-timer-grace-s: 60

    - id: engine-b
      name: "Engine B (demo)"
      base-url: "${INSPECTOR_ENGINE_B_BASE_URL:http://localhost:8082/flowable-rest/service}"
      environment: dev
      accent-color: "#10ac84"
      enabled: true
      mode: read-write
      auth:
        type: basic
        username: rest-admin
        password-ref: ENGINE_B_PASSWORD
      timeouts:
        connect-ms: 2000
        read-ms: 10000
        write-ms: 10000
      max-page-size: 200
      dlq-scan-cap: 5000
      alarm-thresholds:
        oldest-job-warn-min: 5
        oldest-job-crit-min: 15
        overdue-timer-grace-s: 60

    # Flowable 7 engine from the flowable-7 compose profile; flip enabled when it runs.
    - id: engine-7
      name: "Engine 7 (Flowable 7.x)"
      base-url: "${INSPECTOR_ENGINE_7_BASE_URL:http://localhost:8083/flowable-rest/service}"
      environment: dev
      accent-color: "#8e44ad"
      enabled: false
      mode: read-write
      auth:
        type: basic
        username: rest-admin
        password-ref: ENGINE_7_PASSWORD
      timeouts:
        connect-ms: 2000
        read-ms: 10000
        write-ms: 10000
      max-page-size: 200
      dlq-scan-cap: 5000
