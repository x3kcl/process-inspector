# Watchdog for the nightly cron (issue #290). GitHub's scheduler is documented to DELAY or
# silently SKIP a `schedule:` trigger under high Actions load — and on 2026-07-22 it did
# exactly that to `nightly.yml`, with no signal: no run, nothing queued, runners idle. The
# nightly's whole point is catching corrective-action/audit/governance/OIDC regressions
# "within a day"; a silently-skipped run stretches that window invisibly.
#
# This workflow runs a few hours AFTER the nightly's own slot and asks TWO questions.
#
# 1. DID IT RUN? Any nightly run created since 00:00 UTC today (scheduled OR a manual
#    workflow_dispatch — a human covering it counts)? If no, it SELF-HEALS by dispatching a
#    recovery nightly run, and opens a deduplicated `ci`/`P4` alert issue so the miss stays
#    visible to a human (tracking how often GitHub drops the cron).
#
# 2. DID IT PASS? Until 2026-09-15 this workflow stopped at question 1, so a nightly that ran
#    and FAILED was indistinguishable from a healthy one: nightly was red for six consecutive
#    nights (#85–#90, 2026-09-09..14 — a rootless-dind networking break and three npm
#    advisories) while this watchdog reported success every single morning. "A red nightly is
#    triaged in the morning routine" (nightly.yml's header) is only true if something tells
#    the morning. Now it does: a red run opens a deduplicated `ci`/`P3` issue NAMING the
#    failed jobs, and a later green run CLOSES it again — so the alert is self-clearing, and
#    therefore trustworthy rather than one more stale issue to learn to ignore.
#
# A red nightly is deliberately NOT auto-re-dispatched: unlike a skipped cron there is nothing
# to recover, and re-running an hour-long suite that just failed for a real reason only burns
# capacity. Nor does a red nightly fail THIS job — the watchdog is a reporter, and its own red
# must keep meaning "the watchdog itself broke".
#
# Why this can recover on its own without a PAT: `workflow_dispatch` (and `repository_dispatch`)
# are the DOCUMENTED exceptions to GitHub's "events initiated by GITHUB_TOKEN don't start new
# runs" rule — so the built-in token with `actions: write` is enough to kick nightly.yml. No
# extra secret, honoring the env-ref-only iron rule (there's simply nothing to ref here).
#
# This watchdog is itself a `schedule:`, so it shares the same theoretical skip risk — mitigated
# by running at an off-peak, non-top-of-hour minute (GitHub load, and thus skips, cluster at
# :00). It's the cheapest available hedge; a scheduler that drops BOTH offset crons on the same
# day is a broad GitHub incident no in-repo mechanism can paper over.
name: nightly-watchdog

on:
  schedule:
    - cron: "41 8 * * *" # 08:41 UTC — ~6h after nightly's 02:17 slot, off-peak minute
  workflow_dispatch: {}

permissions:
  actions: write # dispatch a recovery nightly.yml run
  issues: write # open the miss-alert issue

concurrency:
  group: nightly-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Recover a skipped nightly and alert (issue #290)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }

          TODAY="$(date -u +%Y-%m-%dT00:00:00Z)"
          # total_count of nightly runs CREATED since midnight UTC — scheduled or manual.
          RUNS_URL="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs"
          COUNT=$(api -G "$RUNS_URL" --data-urlencode "created=>=${TODAY}" --data-urlencode "per_page=1" | jq -r '.total_count')

          # ---- question 2: it ran — but did it PASS? -------------------------------------
          if [ "$COUNT" != "0" ]; then
            echo "nightly already has ${COUNT} run(s) created since ${TODAY} — checking the result."

            RED_MARKER="Nightly is red"
            OPEN_RED=$(api -G "${GITHUB_API_URL}/search/issues" \
              --data-urlencode "q=repo:${GITHUB_REPOSITORY} is:issue is:open in:title ${RED_MARKER}" \
              | jq -r '.items[0].number // empty')

            # Only TODAY's runs, and only finished ones: at 08:41 UTC a 02:17 nightly is long
            # done, and scoping this way means a recovery run still in flight is never judged.
            LATEST=$(api -G "$RUNS_URL" --data-urlencode "created=>=${TODAY}" \
                       --data-urlencode "status=completed" --data-urlencode "per_page=1" \
                     | jq -r '.workflow_runs[0] // empty')

            if [ -z "$LATEST" ]; then
              # Nothing has FINISHED today. Normally that just means we looked early — but a run
              # that still has not finished HOURS after it was created is stuck, and that is
              # exactly as invisible as a red run used to be. nightly.yml's per-job
              # `timeout-minutes` cap a genuine hang, but they never fire on a run that never got
              # a runner at all — and "no runner online, so everything queues forever" is a
              # failure mode this repo has actually hit (see scripts/ci-runner.sh's `ensure`).
              PENDING=$(api -G "$RUNS_URL" --data-urlencode "created=>=${TODAY}" \
                          --data-urlencode "per_page=1" | jq -r '.workflow_runs[0] // empty')
              STUCK_AFTER_HOURS="${STUCK_AFTER_HOURS:-4}"
              AGE_H=-1
              if [ -n "$PENDING" ]; then
                CREATED_AT=$(printf '%s' "$PENDING" | jq -r '.created_at')
                AGE_H=$(( ( $(date -u +%s) - $(date -u -d "$CREATED_AT" +%s) ) / 3600 ))
              fi
              if [ -z "$PENDING" ] || [ "$AGE_H" -lt "$STUCK_AFTER_HOURS" ]; then
                echo "no COMPLETED nightly run yet today (newest is ${AGE_H}h old) — leaving the result check to tomorrow."
                exit 0
              fi
              CONCLUSION="never finished — still '$(printf '%s' "$PENDING" | jq -r '.status')' after ${AGE_H}h"
              RUN_NO=$(printf '%s' "$PENDING" | jq -r '.run_number')
              RUN_URL=$(printf '%s' "$PENDING" | jq -r '.html_url')
              RUN_ID=$(printf '%s' "$PENDING" | jq -r '.id')
            else
              CONCLUSION=$(printf '%s' "$LATEST" | jq -r '.conclusion')
              RUN_NO=$(printf '%s' "$LATEST" | jq -r '.run_number')
              RUN_URL=$(printf '%s' "$LATEST" | jq -r '.html_url')
              RUN_ID=$(printf '%s' "$LATEST" | jq -r '.id')
              echo "latest completed nightly today: #${RUN_NO} -> ${CONCLUSION}"
            fi

            if [ "$CONCLUSION" = "success" ]; then
              # Self-clearing: an alert nobody ever sees closed is an alert nobody believes.
              if [ -n "$OPEN_RED" ]; then
                api -X POST "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${OPEN_RED}/comments" \
                  -d "$(jq -n --arg b "Nightly [#${RUN_NO}](${RUN_URL}) is green — closing automatically." '{body:$b}')" >/dev/null || true
                api -X PATCH "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${OPEN_RED}" \
                  -d '{"state":"closed","state_reason":"completed"}' >/dev/null \
                  && echo "closed #${OPEN_RED} — nightly recovered." \
                  || echo "::warning::nightly is green but closing #${OPEN_RED} failed; it will be retried tomorrow."
              else
                echo "nightly is green — nothing to do."
              fi
              exit 0
            fi

            # Anything that is not success and not still running is worth a human: failure,
            # timed_out, cancelled, startup_failure.
            echo "::warning::Nightly #${RUN_NO} concluded '${CONCLUSION}' — ${RUN_URL}"

            if [ -n "$OPEN_RED" ]; then
              echo "An open '${RED_MARKER}' issue already exists (#${OPEN_RED}); not opening a duplicate."
              exit 0
            fi

            # Name the failing jobs: the difference between an alert and a triage starting point.
            FAILED=$(api -G "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
                       --data-urlencode "per_page=100" \
                     | jq -r '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped")
                                       | "- **\(.name)** — `\(.conclusion)` on `\(.runner_name // "unknown runner")`"] | join("\n")')
            [ -n "$FAILED" ] || FAILED="- (no individual job reported a failure — check the run itself)"

            BODY=$(printf '%s\n' \
              "Nightly [#${RUN_NO}](${RUN_URL}) concluded **${CONCLUSION}**." \
              "" \
              "$FAILED" \
              "" \
              "The nightly is not merge-blocking, but it is the only thing covering the mutating corrective-action, audit-integrity, governance, OIDC and incident-ledger ITs, plus the supply-chain and performance gates — so a red run means that coverage is not happening." \
              "" \
              "This issue is opened once and **closes itself** when a later nightly is green; it is not reopened per night while the failure persists. It is NOT auto-re-dispatched — re-running an hour-long suite that failed for a real reason only burns capacity.")
            api -X POST "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues" \
              -d "$(jq -n --arg t "${RED_MARKER} — #${RUN_NO} ${CONCLUSION} ($(date -u +%F))" --arg b "$BODY" \
                   '{title:$t, body:$b, labels:["ci","P3"]}')" >/dev/null \
              && echo "Opened red-nightly issue." || echo "::warning::Could not open the red-nightly issue (non-fatal)."
            exit 0
          fi

          echo "::warning::No nightly run since ${TODAY} — GitHub's scheduler appears to have skipped the cron. Dispatching a recovery run."

          # Self-heal: start nightly.yml on main. 204 No Content on success (-f treats it so).
          api -X POST "${RUNS_URL%/runs}/dispatches" -d '{"ref":"main"}'
          echo "Recovery nightly dispatched on main."

          # Durable human signal — deduplicated so a multi-day GitHub outage doesn't pile up
          # a new issue every morning. Best-effort: a failure to alert must never fail the
          # (already-succeeded) recovery dispatch.
          MARKER="Nightly cron skipped"
          EXISTING=$(api -G "${GITHUB_API_URL}/search/issues" \
            --data-urlencode "q=repo:${GITHUB_REPOSITORY} is:issue is:open in:title ${MARKER}" \
            | jq -r '.total_count' || echo "unknown")

          if [ "$EXISTING" = "0" ]; then
            BODY=$(printf '%s\n' \
              "GitHub's scheduler did not fire \`nightly.yml\`'s cron since **${TODAY}** — see issue #290 for the documented skip-under-load behavior." \
              "" \
              "This watchdog (\`nightly-watchdog.yml\`) auto-dispatched a **recovery nightly run** on \`main\`, so tonight's coverage is not lost. Check the [nightly runs](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml) for its result and triage any red as usual." \
              "" \
              "Closing note: this is a GitHub-side scheduling gap, not a repo defect. Close once the recovery run is green. Frequent recurrence would justify revisiting the cron time or moving off scheduled triggers.")
            api -X POST "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues" \
              -d "$(jq -n --arg t "${MARKER} $(date -u +%F) — recovery run dispatched" --arg b "$BODY" \
                   '{title:$t, body:$b, labels:["ci","P4"]}')" >/dev/null \
              && echo "Opened miss-alert issue." || echo "::warning::Recovery dispatched, but opening the alert issue failed (non-fatal)."
          else
            echo "An open '${MARKER}' issue already exists (${EXISTING}); not opening a duplicate."
          fi
