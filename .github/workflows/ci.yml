# Merge gates (OPERATIONS §8), run through ci-lib's gate: every job calls `gate.sh ci-light` or
# `gate.sh ci-heavy` (ci/contract.sh holds what each target runs; ci/manifest.env is the contract).
#   pull_request        the light parts: lint, unit, frontend, e2e
#   push to mq/**       a merge-queue batch: the light parts AND the heavy ones (docker, integration)
# There is no push trigger for main: the merge queue (merge-queue@process-inspector) fast-forwards main
# to a batch that already passed all of it. Each part is its own job so the check names the main ruleset
# requires keep their names and the parts run in parallel on the slots (CI_PART picks the part).
# The library is fetched from Gitea at CI_LIB_TAG by .github/actions/ci-lib with the CI_LIB_TOKEN secret.
# Zero-flake doctrine: integration legs gate on docker/smoke-test.sh (bounded readiness probes) before
# Maven touches an engine.
name: ci

on:
  pull_request:
  push:
    branches: ['mq/**']

# A batch is never cancelled: the queue reads its run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/mq/') }}

env:
  CI_LIB_TAG: v0.17

jobs:
  lint:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: ./.github/actions/ci-lib
        with:
          tag: ${{ env.CI_LIB_TAG }}
          token: ${{ secrets.CI_LIB_TOKEN }}
      - name: ci-light (lint — spotless, security audit, shell syntax, node pin, alert rules, orphan ITs)
        env:
          CI_PART: lint
          CI_GATE_HOST: ${{ runner.name }}
          CI_EVENT: ${{ github.event_name }}
        run: bash .ci-lib/gate/gate.sh ci-light

  unit:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: ./.github/actions/ci-lib
        with:
          tag: ${{ env.CI_LIB_TAG }}
          token: ${{ secrets.CI_LIB_TOKEN }}
      - name: ci-light (unit ladder, rungs 1-3 + ArchUnit sleep ban)
        env:
          CI_PART: unit
          CI_GATE_HOST: ${{ runner.name }}
          CI_EVENT: ${{ github.event_name }}
        run: bash .ci-lib/gate/gate.sh ci-light
      - name: Upload JaCoCo report
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/jacoco.xml
          retention-days: 14

  frontend:
    runs-on: self-hosted
    timeout-minutes: 20
    services:
      # The OpenAPI drift gate boots the REAL BFF. Engines may be absent (health degrades,
      # boot succeeds — ARCH §2.2), but Postgres is a hard boot dependency (Flyway +
      # ddl-auto=validate), so it runs as a service. Container-port-only mapping: Docker
      # assigns a random free HOST port (read via job.services below), so concurrent
      # frontend jobs on different runner slots never collide and no slot entry is needed.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inspector
          POSTGRES_USER: inspector
          POSTGRES_PASSWORD: inspector
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U inspector"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: ./.github/actions/ci-lib
        with:
          tag: ${{ env.CI_LIB_TAG }}
          token: ${{ secrets.CI_LIB_TOKEN }}
      # ci/contract.sh frontend: toolchain guards, ESLint, Prettier, Vitest with coverage floors,
      # build (watermark + no-enterprise guards + tsc + vite), then the OpenAPI drift gate (R-SEM-15)
      # on the BFF port the runner slot owns (PI_BFF_PORT, resolved by scripts/free-port.sh) and the
      # service's Docker-assigned Postgres port below.
      - name: ci-light (frontend)
        env:
          CI_PART: frontend
          CI_GATE_HOST: ${{ runner.name }}
          CI_EVENT: ${{ github.event_name }}
          INSPECTOR_DB_URL: jdbc:postgresql://localhost:${{ job.services.postgres.ports['5432'] }}/inspector
        run: bash .ci-lib/gate/gate.sh ci-light
      - name: Upload vitest coverage summary
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/coverage-summary.json
          retention-days: 14

  # Playwright + axe (#85, TEST-STRATEGY §1 R4: "axe accessibility checks hard-fail"). The
  # ~17 e2e/*.spec.ts specs are hermetic BY CONSTRUCTION (every /api call is page.route-
  # fulfilled) — no BFF, engine, or Postgres needed, just the plain Vite dev server. Chromium
  # + its OS deps are baked into the CI runner image (docker/ci-runner/Dockerfile).
  e2e:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/ci-lib
        with:
          tag: ${{ env.CI_LIB_TAG }}
          token: ${{ secrets.CI_LIB_TOKEN }}
      # The slot's Vite port (PI_E2E_PORT) is resolved inside ci/contract.sh e2e.
      - name: ci-light (e2e)
        env:
          CI_PART: e2e
          CI_GATE_HOST: ${{ runner.name }}
          CI_EVENT: ${{ github.event_name }}
        run: bash .ci-lib/gate/gate.sh ci-light
      - name: Upload the HTML report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # ---- the heavy parts: a merge-queue batch only ----------------------------------------------
  docker:
    if: "${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/mq/') }}"
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-lib
        with:
          tag: ${{ env.CI_LIB_TAG }}
          token: ${{ secrets.CI_LIB_TOKEN }}
      # ci/contract.sh docker: the BFF image and the web image (#412), built and not pushed. Build only,
      # deliberately no Trivy scan (a new CVE must not redden every open PR; the scan is nightly.yml's).
      # Plain `docker build` on the slot's daemon: the type=gha layer cache of the old job is gone with
      # docker/build-push-action (its export timed out this job three times, #337/#339).
      - name: ci-heavy (docker)
        env:
          CI_PART: docker
          CI_GATE_HOST: ${{ runner.name }}
          CI_EVENT: ${{ github.event_name }}
        run: bash .ci-lib/gate/gate.sh ci-heavy

  integration:
    if: "${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/mq/') }}"
    runs-on: self-hosted
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the three keys and their order: they spell the job name the ruleset requires. The same
          # table is IT_LEGS in ci/contract.sh (what `contract.sh ci-heavy` runs with no CI_PART).
          # composeProfiles is explicit on every leg: most are "${profile},postgres", but the
          # dual-major findings leg boots two engine profiles at once (#362). "profile" is the
          # smoke-test.sh / CI_PROJECT alias and may differ from the compose profile set.
          - profile: flowable-6
            composeProfiles: "flowable-6,postgres"
            itClass: EngineHealthIT,SearchServiceIT,TriageAggregationIT,TriageCmmnScopeIT,CaseDetailIT,KwayPagingIT
          - profile: flowable-7
            composeProfiles: "flowable-7,postgres"
            itClass: EngineHealth7IT,Search7IT,Triage7IT,ExternalWorkerJob7IT,Kway7IT
          # 7.2 and 8.0 (#459) run the SAME *7IT classes. The contract points PI_ENGINE_7_PORT at
          # this leg's engine so those classes are not forked.
          # EngineVersionCanaryIT rejects a leg that is still talking to 7.1.0.
          - profile: flowable-72
            composeProfiles: "flowable-72,postgres"
            itClass: EngineVersionCanaryIT,EngineHealth7IT,Search7IT,Triage7IT,ExternalWorkerJob7IT,Kway7IT
          - profile: flowable-80
            composeProfiles: "flowable-80,postgres"
            itClass: EngineVersionCanaryIT,EngineHealth7IT,Search7IT,Triage7IT,ExternalWorkerJob7IT,Kway7IT
          - profile: legacy
            composeProfiles: "legacy,postgres"
            itClass: EngineHealthLegacyIT,SearchLegacyIT,TriageLegacyIT,ExternalWorkerJobLegacyIT,TriageCmmnScopeLegacyIT
          # The Boot-layout leg: an APPLICATION embedding Flowable (flap) — /process-api with
          # root-level /cmmn-api + /external-job-api siblings, behind its own Basic-auth service
          # account. Neither shape can be exercised by the flowable-rest war images above, and
          # this inspector runs against exactly that shape in production. The engine image is
          # ghcr.io/x3kcl/flap:latest, republished by flap on every push to master; the package
          # grants this repo Actions read access, so the run's own GITHUB_TOKEN pulls it.
          - profile: flap
            composeProfiles: "flap,postgres"
            itClass: BootLayoutEngineIT
          # Dual-major typed-findings leg (#362): MigrationFindingsIT calibrates severity on
          # BOTH 6.8 and 7.1 in one suite (it-findings profile), so this leg boots both
          # compose profiles at once. "migration-findings" is a smoke-test alias, not a
          # compose profile. Costs one extra engine vs the flowable-6 leg (A+B already; +7);
          # engines run on the host daemon, outside the runner mem_limit.
          - profile: migration-findings
            composeProfiles: "flowable-6,flowable-7,postgres"
            itClass: MigrationFindingsIT
          # Cohort migration through the bulk machinery (#496): same dual-major stack, own leg so
          # the required "MigrationFindingsIT" job name stays unchanged.
          - profile: migration-findings
            composeProfiles: "flowable-6,flowable-7,postgres"
            itClass: BulkMigrationIT
          # Hierarchy-aware migration (#497): the 3-level call-activity tree on both majors, own
          # leg for the same reason.
          - profile: migration-findings
            composeProfiles: "flowable-6,flowable-7,postgres"
            itClass: HierarchyMigrationIT
          # Case migration (#500): single case and cohort on 6.8, plus batch and historic on 7.1.
          # Same dual-major stack; its own leg so the job names above stay as the ruleset has them.
          - profile: migration-findings
            composeProfiles: "flowable-6,flowable-7,postgres"
            itClass: CaseMigrationIT
    env:
      # Dependabot PRs (#445) run on the slot runners, but that actor's token is read-only and
      # cannot pull the private flap image: that leg's registry steps and the contract's leg skip.
      SKIP_LEG: ${{ (matrix.profile == 'flap' && github.actor == 'dependabot[bot]') && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: env.SKIP_LEG != '1'
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: ./.github/actions/ci-lib
        with:
          tag: ${{ env.CI_LIB_TAG }}
          token: ${{ secrets.CI_LIB_TOKEN }}
      # Mitigates Docker Hub 429s on shared runner NAT pools; skips cleanly when the
      # secrets are absent (forks, or before they're configured).
      - name: Docker Hub login (rate-limit mitigation)
        if: env.SKIP_LEG != '1'
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # ghcr, for the flap leg's engine. The package is private and grants THIS REPO Actions
      # read access, so the run's own GITHUB_TOKEN suffices — no long-lived PAT in a secret.
      - name: Registry login (ghcr — the flap harness image)
        if: matrix.profile == 'flap' && env.SKIP_LEG != '1'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pull EVERY run. A self-hosted runner caches images for weeks — that cache once hid a
      # missing registry permission entirely, and it would equally hide a months-old flap.
      - name: Pull the flap engine (flap republishes :latest on every push to master)
        if: matrix.profile == 'flap' && env.SKIP_LEG != '1'
        run: |
          docker pull ghcr.io/x3kcl/flap:latest
          docker image inspect ghcr.io/x3kcl/flap:latest \
            --format 'flap engine under test: {{index .RepoDigests 0}} built {{.Created}}'
      # ci/contract.sh integration: resolve the slot's port block (scripts/free-port.sh), pre-clean
      # this leg's own compose project, boot the harness, docker/smoke-test.sh, docker/seed.sh,
      # point Testcontainers' Ryuk at the real socket on rootless slots, failsafe, always tear down.
      - name: ci-heavy (integration, ${{ matrix.itClass }})
        env:
          CI_PART: integration
          CI_IT_PROFILE: ${{ matrix.profile }}
          CI_IT_COMPOSE_PROFILES: ${{ matrix.composeProfiles }}
          CI_IT_CLASS: ${{ matrix.itClass }}
          CI_GATE_HOST: ${{ runner.name }}
          CI_EVENT: ${{ github.event_name }}
        run: bash .ci-lib/gate/gate.sh ci-heavy
