# Nightly full integration suite (Q2 — IMPROVEMENT-PLAN-2026-07 P0 #5). The PR merge gate
# (ci.yml) runs 16 read-oriented engine ITs; the zero-flake doctrine keeps the mutating,
# audit-integrity, DB-CRUD and Keycloak ITs off the per-PR path. This workflow runs those
# 27 local-only ITs once a night (and on demand) so a regression in a corrective-action rail,
# the fail-closed audit chain, four-eyes governance, registry reload, OIDC resolution or the
# incident-ledger substrate (#294) is caught within a day instead of at the next manual local
# run.
#
# NOT merge-blocking: a red nightly is triaged in the morning routine, not a push gate.
# Runs on the same single self-hosted runner (docker/ci-runner) — serialized after any PR run.
# Trigger manually to shake it out: Actions → nightly → Run workflow (workflow_dispatch).
name: nightly

on:
  schedule:
    # 02:17 UTC daily — deliberately NOT top-of-hour: GitHub's scheduler load (and thus its
    # documented drop/skip of schedule triggers) clusters at :00, which is what skipped this
    # cron on 2026-07-22 (issue #290). nightly-watchdog.yml recovers a miss regardless.
    - cron: "17 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Self-provisioning ITs: each spins its own Postgres 16 / Keycloak via Testcontainers
  # (@DynamicPropertySource) — no compose engine, just the Docker socket the runner already
  # mounts. Audit partition/retention/roles + fail-closed, shared/team views + governance,
  # view store, mapping store + access-admin CRUD, registry store/reload, and the real-Keycloak
  # OIDC resolver IT.
  container-its:
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Mitigates Docker Hub 429s on the shared NAT pool; skips cleanly when secrets are absent.
      - name: Docker Hub login (rate-limit mitigation)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Container ITs (Testcontainers — Postgres / Keycloak, no compose engine)
        working-directory: backend
        run: >-
          mvn -B verify -Dskip.surefire.tests=true
          -Dit.test=AuditRoleGrantsIT,AuditPartitionCarveIT,AuditPartitionMaintainerIT,AuditRetentionPurgeIT,AuditRetentionPurgerIT,AuditIntegrityIT,SharedViewIT,SharedViewFailClosedIT,SharedViewGovernanceIT,ViewStoreIT,AccessMappingAdminDbIT,MappingStoreDbIT,EngineRegistryStoreIT,EngineRegistryReloadIT,OidcKeycloakIT,IncidentLedgerIT

  # R-TEST-05 P2 (issue #299, TEST-STRATEGY.md §7): 50k-row DLQ vs dlq-scan-cap, at the
  # documented operating scale — see docs/TRACEABILITY-MATRIX.md §A (R-TEST-05 row). Fully
  # self-contained: DlqScanCapVolumeIT boots an in-process JDK HttpServer stub engine
  # (io.inspector.support.StubFlowableEngine, its own ephemeral port) instead of a compose
  # engine, so this job needs no docker socket, no port-block resolution, and can never
  # collide with a concurrent PR/nightly job's slot (the #163/#288 port-squatting class of
  # flake this repo has hit before on compose-backed jobs). Genuinely independent of every
  # other nightly job — a red run here never blocks or queues behind the engine matrix.
  # Distinct name from `perf-p1` on purpose (that job is R-NFR-02/P4, a latency SLA against
  # healthy engines — TEST-STRATEGY's P1/P2/P4 ordinals are NOT incident-severity tiers;
  # see the naming-collision note on issue #298).
  dlq-scan-cap-p2:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: R-TEST-05 P2 — 50k-row DLQ scan-cap volume suite (docker-free)
        working-directory: backend
        run: mvn -B verify -Dskip.surefire.tests=true -Dit.test=DlqScanCapVolumeIT

  # R-TEST-05 P1 (issue #298, TEST-STRATEGY.md §7): "10 stub engines, 3 slow, 2 timing out" —
  # partial-failure fan-out do-no-harm. Same docker-free, self-contained shape as
  # dlq-scan-cap-p2 above (extends the SAME StubFlowableEngine foundation, io.inspector.support,
  # that job's PR #322 built as a reusable base): 10 in-process JDK HttpServer stub engines on
  # their own ephemeral ports, no compose stack, no port-block resolution, no collision with a
  # concurrent PR/nightly job's slot. Genuinely independent of every other nightly job.
  # Distinct name from BOTH `perf-p1` and `dlq-scan-cap-p2` on purpose — TEST-STRATEGY's P1/P2/P4
  # are ordinals in its performance-scenario catalog, not incident-severity tiers (`perf-p1` is
  # actually P4, R-NFR-02, a latency SLA against 5 HEALTHY engines — the naming-collision note
  # on issue #298).
  fanout-partial-failure-p1:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: R-TEST-05 P1 — 10-stub-engine partial-failure fan-out suite (docker-free)
        working-directory: backend
        run: mvn -B verify -Dskip.surefire.tests=true -Dit.test=FanoutPartialFailureIT

  # Engine-dependent ITs: the mutating corrective-action / flow-surgery / migration / bulk rails
  # and the seed-driven detail/timeline/snapshot ITs. Same compose harness the ci.yml matrix
  # uses (flowable-6 + postgres, port-remapped off the dev/demo stacks); the ITs' OWN datasource
  # is a Testcontainers Postgres, so the compose postgres profile is only there for parity.
  engine-its:
    runs-on: self-hosted
    timeout-minutes: 40
    env:
      COMPOSE_PROFILES: "flowable-6,postgres"
      CI_PROJECT: pi-ci-nightly-6
    steps:
      - uses: actions/checkout@v4
      # Runner slots (docker/ci-runner/docker-compose.yml) carry a disjoint port block as
      # container env so this job uses its ACTUAL slot's ports, never a hardcoded literal
      # that may belong to a DIFFERENT slot a concurrent ci.yml PR job is using at the same
      # time (#163 — this job used to hardcode slot-1's literal values unconditionally,
      # regardless of which slot actually ran it). Resolved the same way ci.yml's
      # "integration" job does; slot-1 values are the fallback for a slot-less runner.
      # scripts/free-port.sh additionally double-checks each port is actually free on THIS
      # host and falls back within the slot's own band otherwise (#163/#288 — a slot's
      # fixed port can end up permanently squatted by something unrelated; this makes that
      # self-healing instead of needing a manual reassignment).
      - name: Resolve the slot port namespace
        run: |
          {
            a=$(scripts/free-port.sh "${PI_ENGINE_A_PORT:-8691}" 20)
            b=$(scripts/free-port.sh "${PI_ENGINE_B_PORT:-8692}" 20 "$a")
            pg=$(scripts/free-port.sh "${PI_PG_PORT:-5435}" 5)
            echo "PI_ENGINE_A_PORT=$a"
            echo "PI_ENGINE_B_PORT=$b"
            echo "PI_PG_PORT=$pg"
            echo "INSPECTOR_DB_URL=jdbc:postgresql://localhost:${pg}/inspector"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Docker Hub login (rate-limit mitigation)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pre-clean CI harness residue (scoped to $CI_PROJECT)
        run: docker compose -p "$CI_PROJECT" -f docker/docker-compose.dev.yml down -v --remove-orphans || true
      - name: Boot harness (flowable-6 + postgres)
        run: docker compose -p "$CI_PROJECT" -f docker/docker-compose.dev.yml up -d
      - name: Wait for engines and postgres (bounded)
        run: bash docker/smoke-test.sh flowable-6
      - name: Seed demo processes (REST-only, idempotent)
        run: bash docker/seed.sh --profile flowable-6
      - name: Engine ITs (failsafe)
        working-directory: backend
        run: >-
          mvn -B verify -Dskip.surefire.tests=true
          -Dit.test=CorrectiveActionIT,CmmnCorrectiveActionIT,FailClosedAuditIT,FlowSurgeryIT,BulkFilterIT,BulkErrorClassIT,SnapshotSamplerIT,DefinitionVersionsIT,MigrationIT,DetailResolveIT,InstanceTimelineIT,IncidentLedgerArcIT
      - name: Dump harness logs
        if: failure()
        run: docker compose -p "$CI_PROJECT" -f docker/docker-compose.dev.yml logs --no-color --timestamps
      - name: Tear down CI harness
        if: always()
        run: docker compose -p "$CI_PROJECT" -f docker/docker-compose.dev.yml down -v --remove-orphans || true

  # Supply-chain gates (Q9/issue #93): image vuln scan, SBOM, and both dependency trees'
  # audits. NOT merge-blocking (nightly-only) — a fresh CVE landing on an existing pinned
  # version must not turn every in-flight PR red; it's triaged same as an IT failure.
  #
  # Trivy DB caching: run 30207549362 hit this job's timeout (~30min) apparently on Trivy DB
  # download slowness, vs. ~5min on the 05:42 run the same day. Checked whether a cache was
  # missing before adding one: aquasecurity/trivy-action@v0.36.0 (pinned below, all three
  # steps) already restores/saves the Trivy DB via `actions/cache` internally (its `cache`
  # input defaults to `true`, unset here) keyed on the current UTC date — so the DB is
  # already reused across same-day runs without any wiring in THIS workflow. The slow run was
  # most likely a cache-miss cold pull (first run of a UTC day, or a cache eviction) hitting
  # slow egress on this box, not an absent cache mechanism — left as-is per the trivy-action
  # docs; do not add a second/duplicate `actions/cache` step around these Trivy steps.
  supply-chain:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Mitigates Docker Hub 429s on the shared NAT pool (base images: maven, eclipse-temurin);
      # skips cleanly when secrets are absent.
      - name: Docker Hub login (rate-limit mitigation)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build BFF image (loaded locally for scanning, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: process-inspector:nightly-scan
          cache-from: type=gha
          # The runtime stage's `apk upgrade` re-resolves against the live Alpine index ONLY
          # if it is not served from cache — its cache key is the literal command string, so
          # a warm cache replays a stale package set forever. That is what reddened nightly
          # #66/#67 on CVE-2026-14456: every layer logged `CACHED`, so the scanned image was
          # a byte-identical replay of an older build and could never pick up the published
          # openssl 3.5.8-r0. Scoped to the (small) runtime stage — the maven `build` stage
          # keeps its cache, so this costs seconds, not the whole compile.
          no-cache-filters: runtime
          # Same GHA-cache-export-slowness timeout hit ci.yml's docker job 3x today
          # (mode=max upload of build-stage layers stalling the "exporting to GitHub Actions
          # Cache" step) — mode=min + ignore-error=true so a slow/broken cache service can
          # never block this job either.
          cache-to: type=gha,mode=min,ignore-error=true
      - name: Trivy image scan (HIGH/CRITICAL fixed-in-upstream vulns fail the run)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: process-inspector:nightly-scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (CycloneDX) for the built image
        uses: anchore/sbom-action@v0.22.0
        with:
          image: process-inspector:nightly-scan
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-image
          path: sbom-image.cdx.json
          retention-days: 90
      # Web image, held to exactly the standard the BFF image above already is (issue
      # #409). It was scanned by NOTHING until then, and shipped 35 fixable HIGH/CRITICAL
      # findings (2 CRITICAL) to ghcr.io/Docker Hub and to the public demo — every one of
      # them already patched upstream. Parity, not novelty: same build shape, same
      # `no-cache-filters`, same scan flags, its own SBOM.
      - name: Build web image (loaded locally for scanning, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: process-inspector-web:nightly-scan
          cache-from: type=gha
          # Same reason as the BFF image above: the runtime stage's `apk upgrade` only
          # re-resolves against the live Alpine index when it is not replayed from cache.
          no-cache-filters: runtime
          cache-to: type=gha,mode=min,ignore-error=true
      - name: Trivy web-image scan (HIGH/CRITICAL fixed-in-upstream vulns fail the run)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: process-inspector-web:nightly-scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (CycloneDX) for the built web image
        uses: anchore/sbom-action@v0.22.0
        with:
          image: process-inspector-web:nightly-scan
          format: cyclonedx-json
          output-file: sbom-web-image.cdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-web-image
          path: sbom-web-image.cdx.json
          retention-days: 90
      # Base-image currency (issue #413) — the blind spot the scans above structurally
      # cannot see. Both Trivy image steps scan AFTER `apk upgrade`, so a base that has
      # aged but is still patchable scans GREEN: the drift is invisible precisely because
      # the compensating mechanism works, and only becomes visible once a CVE lands that
      # `apk upgrade` can no longer reach — i.e. after it is already a problem. That is how
      # frontend/Dockerfile sat three Alpine minors behind the BFF (35 fixable HIGH/CRITICAL
      # in the base as pulled) with every gate green, until #409/#411 went looking.
      # Runs after the scans on purpose: a red here means "go bump a base within a day",
      # which is nightly-shaped triage, not a push gate.
      - name: Base-image currency (drift vs Alpine stable + skew between our images)
        run: bash scripts/check-base-image-currency.sh

      # Backend dependency audit: Trivy's filesystem scanner over pom.xml, NOT OWASP
      # dependency-check-maven — tried that first, and a cold run against the real NVD API
      # hard-failed with HTTP 429 after several minutes (confirmed empirically): NVD
      # throttles unregistered callers hard, and this repo deliberately provisions no
      # NVD_API_KEY (env-ref-only secrets, iron rule — a personal NVD registration isn't a
      # credential worth adding just for this gate). Trivy ships its own vulnerability DB
      # (pulled from a container registry, not the NVD API per-request), so it doesn't hit
      # this wall; it's also the same tool already used for the image scan above.
      - name: Backend dependency audit (Trivy fs scan of pom.xml, HIGH/CRITICAL hard-fails)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend/pom.xml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Dated-exception doctrine, extended to Trivy's leg (follow-up to #297): Trivy's fs
      # scan of the lockfile is a SECOND, independent gate over the same data as the
      # npm-audit allowlist gate below, and was never made allowlist-aware — it used to
      # hard-fail on the identical GHSA-qwww-vcr4-c8h2 finding the npm-audit gate already
      # allowlists. frontend/.trivyignore.yaml carries the matching dated exception (its own
      # `expired_at` governs the gate the same way the npm allowlist's `expires` does — see
      # that file's header for the verified expiry behavior). Scoped to THIS step only via
      # `trivyignores` — never the image scan or the backend pom.xml fs scan above.
      - name: Frontend dependency audit — Trivy fs scan (HIGH/CRITICAL hard-fails)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend/package-lock.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: frontend/.trivyignore.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # A bare `npm audit --audit-level=high` goes permanently red the moment ANY high+
      # advisory has no in-range fix (issue #297 — react-router's RSC-only CVE, and the
      # @redocly/openapi-core -> minimatch -> brace-expansion chain stalled at a major
      # boundary) — training the team to ignore this job entirely, which is worse than no
      # gate. scripts/check-npm-audit-allowlist.mjs diffs the audit output against a
      # checked-in, dated allowlist (frontend/npm-audit-allowlist.json): it still hard-fails
      # on any high/critical advisory that ISN'T allowlisted, and additionally fails once an
      # allowlist entry's own expiry date passes (even if the advisory is still unfixed) so
      # an exception can't just sit there forever — someone has to re-look, re-check for a
      # fresh in-range fix, and renew (new date + justification) or escalate. Runnable
      # locally: `node scripts/check-npm-audit-allowlist.mjs` (needs `frontend/node_modules`
      # from a prior `npm ci`).
      - name: Frontend dependency audit (npm audit vs. the dated allowlist — issue #297)
        run: |
          (cd frontend && npm ci)
          node scripts/check-npm-audit-allowlist.mjs

  # P1 performance gate (SPEC §2 R-NFR-01, issue #93 Part B): the FIX-REF-01 reference
  # dataset (TEST-SCENARIOS.md §1.6 — 3 defs x 3 versions x 4 failure signatures, ~20k
  # historic + 2k active, 5k dead-letter jobs matching each engine's dlq-scan-cap, 200
  # suspended, tenants a/b) is what the k6 thresholds in perf-scenario-p1.js are calibrated
  # against; a smaller dataset would under-test the DLQ-scan-driven search_failed bound.
  # Own port block, resolved from the ACTUAL runner slot (#163) — never a hardcoded literal
  # a concurrent job on that slot might also be using. The FALLBACK defaults below (used
  # only on a slot-less runner, where no per-job disambiguation exists) stay their OWN
  # disjoint set from engine-its' fallback, since both jobs run concurrently within the
  # same nightly run.
  # NOT merge-blocking, same as the rest of this workflow — a perf regression is triaged
  # same as an IT failure, not a push gate.
  perf-p1:
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      COMPOSE_PROFILES: "flowable-6,postgres"
      CI_PROJECT: pi-ci-nightly-perf
    steps:
      - uses: actions/checkout@v4
      # scripts/free-port.sh double-checks each port is actually free on THIS host and
      # falls back within this job's own band otherwise (#163/#288 — a fixed port can end
      # up permanently squatted by something unrelated; this makes that self-healing
      # instead of needing a manual reassignment).
      - name: Resolve the slot port namespace
        run: |
          {
            a=$(scripts/free-port.sh "${PI_ENGINE_A_PORT:-8695}" 20)
            b=$(scripts/free-port.sh "${PI_ENGINE_B_PORT:-8696}" 20 "$a")
            pg=$(scripts/free-port.sh "${PI_PG_PORT:-5436}" 5)
            bff=$(scripts/free-port.sh "${PI_BFF_PORT:-8697}" 20)
            echo "PI_ENGINE_A_PORT=$a"
            echo "PI_ENGINE_B_PORT=$b"
            echo "PI_PG_PORT=$pg"
            echo "PI_BFF_PORT=$bff"
            echo "INSPECTOR_DB_URL=jdbc:postgresql://localhost:${pg}/inspector"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Docker Hub login (rate-limit mitigation)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pre-clean CI harness residue (scoped to $CI_PROJECT)
        run: docker compose -p "$CI_PROJECT" -f docker/docker-compose.dev.yml down -v --remove-orphans || true
      - name: Boot harness (flowable-6 + postgres)
        run: docker compose -p "$CI_PROJECT" -f docker/docker-compose.dev.yml up -d
      - name: Wait for engines and postgres (bounded)
        run: bash docker/smoke-test.sh flowable-6
      # Full FIX-REF-01 scale (default --scale 1.0): ~27k starts/engine, empirically ~90s/
      # engine at 32 workers against this harness — comfortably inside the timeout above.
      # Explicit engine URLs: the flowable-6 profile only brings up A+B, and the script's
      # own no-args default additionally probes the (here, absent) engine-7/legacy ports.
      - name: Seed FIX-REF-01 reference dataset (REST-only, idempotent)
        run: >-
          python3 docker/seed-reference.py
          "http://localhost:${PI_ENGINE_A_PORT}/flowable-rest/service"
          "http://localhost:${PI_ENGINE_B_PORT}/flowable-rest/service"
      - name: Build BFF jar
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Boot BFF in the background, pointed at the seeded engines
        working-directory: backend
        env:
          INSPECTOR_ENGINE_A_BASE_URL: http://localhost:${{ env.PI_ENGINE_A_PORT }}/flowable-rest/service
          INSPECTOR_ENGINE_B_BASE_URL: http://localhost:${{ env.PI_ENGINE_B_PORT }}/flowable-rest/service
          ENGINE_A_PASSWORD: test
          ENGINE_B_PASSWORD: test
          SERVER_PORT: ${{ env.PI_BFF_PORT }}
        run: |
          JAR=$(ls target/*.jar | head -1)
          nohup java -jar "$JAR" > /tmp/bff-perf.log 2>&1 &
          echo $! > /tmp/bff-perf.pid
      - name: Wait for /v3/api-docs (bounded)
        run: |
          for _ in $(seq 1 90); do
            curl -fsS "http://localhost:${PI_BFF_PORT}/v3/api-docs" > /dev/null && exit 0
            sleep 2
          done
          echo "::error::BFF did not serve /v3/api-docs within 180s"
          tail -200 /tmp/bff-perf.log
          exit 1
      # Dockerized k6 (host network so it reaches the BFF on localhost:$PI_BFF_PORT) — the
      # dev viewer/dev credentials are the k6 script's own defaults (SecurityConfig, !oidc).
      - name: k6 — P1 latency budgets (SPEC §2, R-NFR-01/02)
        run: |
          docker run --rm --network host \
            -e BASE_URL="http://localhost:${PI_BFF_PORT}" \
            -v "$PWD/scripts:/scripts:ro" \
            -v /tmp:/out \
            grafana/k6:2.1.0 run --summary-export=/out/k6-summary-p1.json /scripts/perf-scenario-p1.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary-p1
          path: /tmp/k6-summary-p1.json
          retention-days: 90
          if-no-files-found: warn
      - name: Dump BFF log
        if: failure()
        run: tail -200 /tmp/bff-perf.log || true
      - name: Reap the background BFF
        if: always()
        run: kill "$(cat /tmp/bff-perf.pid 2>/dev/null)" 2>/dev/null || true
      - name: Dump harness logs
        if: failure()
        run: docker compose -p "$CI_PROJECT" -f docker/docker-compose.dev.yml logs --no-color --timestamps
      - name: Tear down CI harness
        if: always()
        run: docker compose -p "$CI_PROJECT" -f docker/docker-compose.dev.yml down -v --remove-orphans || true
