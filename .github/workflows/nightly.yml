# Nightly full integration suite (Q2 — IMPROVEMENT-PLAN-2026-07 P0 #5). The PR merge gate
# (ci.yml) runs 16 read-oriented engine ITs; the zero-flake doctrine keeps the mutating,
# audit-integrity, DB-CRUD and Keycloak ITs off the per-PR path. This workflow runs those
# 36 local-only ITs once a night (and on demand) so a regression in a corrective-action rail,
# the fail-closed audit chain, four-eyes governance, registry reload, OIDC resolution or the
# incident-ledger substrate (#294) is caught within a day instead of at the next manual local
# run.
#
# NOT merge-blocking: a red nightly is triaged in the morning routine, not a push gate.
# Runs on the same single self-hosted runner (docker/ci-runner) — serialized after any PR run.
# Trigger manually to shake it out: Actions → nightly → Run workflow (workflow_dispatch).
# Each job runs its part through the ci-lib gate (#641): `gate.sh ci-nightly` with CI_PART=<job id>;
# the commands live in ci/contract.sh (reproduce one with `CI_PART=perf-p1 bash ci/contract.sh ci-nightly`).
# This file keeps the triggers, toolchain setup, logins, timeouts and artifacts. supply-chain stays
# on its composite action (marketplace scanners, no shell to move).
name: nightly

on:
  schedule:
    # 02:17 UTC daily — deliberately NOT top-of-hour: GitHub's scheduler load (and thus its
    # documented drop/skip of schedule triggers) clusters at :00, which is what skipped this
    # cron on 2026-07-22 (issue #290). nightly-watchdog.yml recovers a miss regardless.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      triage-drill:
        description: "off runs the suite. red/green only upserts the advisory issue (#447) and skips every other job."
        type: choice
        options: ["off", red, green]
        default: "off"  # quoted: YAML 1.1 reads bare off as false (#611)

env:
  CI_LIB_TAG: v0.16   # keep equal to ci.yml

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Self-provisioning ITs: each spins its own Postgres 16 / Keycloak via Testcontainers
  # (@DynamicPropertySource) — no compose engine, just the Docker socket the runner already
  # mounts. Audit partition/retention/roles + fail-closed, shared/team views + governance,
  # view store, mapping store + access-admin CRUD, registry store/reload, and the real-Keycloak
  # OIDC resolver IT.
  container-its:
    runs-on: self-hosted
    if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["red","green"]'), inputs.triage-drill)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Mitigates Docker Hub 429s on the shared NAT pool; skips cleanly when secrets are absent.
      - name: Docker Hub login (rate-limit mitigation)
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/ci-lib
        with:
          tag: ${{ env.CI_LIB_TAG }}
          token: ${{ secrets.CI_LIB_TOKEN }}
      - name: ci-nightly (container-its)
        env:
          CI_PART: container-its
          CI_GATE_HOST: ${{ runner.name }}
          CI_EVENT: ${{ github.event_name }}
        run: bash .ci-lib/gate/gate.sh ci-nightly

  # R-TEST-05 P2 (issue #299, TEST-STRATEGY.md §7): 50k-row DLQ vs dlq-scan-cap, at the
  # documented operating scale — see docs/TRACEABILITY-MATRIX.md §A (R-TEST-05 row). Fully
  # self-contained: DlqScanCapVolumeIT boots an in-process JDK HttpServer stub engine
  # (io.inspector.support.StubFlowableEngine, its own ephemeral port) instead of a compose
  # engine, so this job needs no docker socket, no port-block resolution, and can never
  # collide with a concurrent PR/nightly job's slot (the #163/#288 port-squatting class of
  # flake this repo has hit before on compose-backed jobs). Genuinely independent of every
  # other nightly job — a red run here never blocks or queues behind the engine matrix.
  # Distinct name from `perf-p1` on purpose (that job is R-NFR-02/P4, a latency SLA against
  # healthy engines — TEST-STRATEGY's P1/P2/P4 ordinals are NOT incident-severity tiers;
  # see the naming-collision note on issue #298).
  dlq-scan-cap-p2:
    runs-on: self-hosted
    if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["red","green"]'), inputs.triage-drill)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: ./.github/actions/ci-lib
        with:
          tag: ${{ env.CI_LIB_TAG }}
          token: ${{ secrets.CI_LIB_TOKEN }}
      - name: ci-nightly (dlq-scan-cap-p2)
        env:
          CI_PART: dlq-scan-cap-p2
          CI_GATE_HOST: ${{ runner.name }}
          CI_EVENT: ${{ github.event_name }}
        run: bash .ci-lib/gate/gate.sh ci-nightly

  # R-TEST-05 P1 (issue #298, TEST-STRATEGY.md §7): "10 stub engines, 3 slow, 2 timing out" —
  # partial-failure fan-out do-no-harm. Same docker-free, self-contained shape as
  # dlq-scan-cap-p2 above (extends the SAME StubFlowableEngine foundation, io.inspector.support,
  # that job's PR #322 built as a reusable base): 10 in-process JDK HttpServer stub engines on
  # their own ephemeral ports, no compose stack, no port-block resolution, no collision with a
  # concurrent PR/nightly job's slot. Genuinely independent of every other nightly job.
  # Distinct name from BOTH `perf-p1` and `dlq-scan-cap-p2` on purpose — TEST-STRATEGY's P1/P2/P4
  # are ordinals in its performance-scenario catalog, not incident-severity tiers (`perf-p1` is
  # actually P4, R-NFR-02, a latency SLA against 5 HEALTHY engines — the naming-collision note
  # on issue #298).
  fanout-partial-failure-p1:
    runs-on: self-hosted
    if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["red","green"]'), inputs.triage-drill)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: ./.github/actions/ci-lib
        with:
          tag: ${{ env.CI_LIB_TAG }}
          token: ${{ secrets.CI_LIB_TOKEN }}
      - name: ci-nightly (fanout-partial-failure-p1)
        env:
          CI_PART: fanout-partial-failure-p1
          CI_GATE_HOST: ${{ runner.name }}
          CI_EVENT: ${{ github.event_name }}
        run: bash .ci-lib/gate/gate.sh ci-nightly

  # R-TEST-05 P3 (issue #467, TEST-STRATEGY.md §7, TRACEABILITY-MATRIX §C-8): SSE + bulk soak.
  # 50 SSE subscribers held for 20 minutes while 600-item filter bulks run back to back against
  # two in-process StubFlowableEngines. The BFF, stubs and SSE clients share the test JVM, so no
  # slot port block is resolved and no container ever has to reach back to the runner (the hp02
  # rootless-DinD slots have no such route). The only docker use is the Testcontainers Postgres
  # the bulk/audit rows live in, reached runner → container like container-its.
  soak-p3:
    runs-on: self-hosted
    if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["red","green"]'), inputs.triage-drill)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Docker Hub login (rate-limit mitigation)
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/ci-lib
        with:
          tag: ${{ env.CI_LIB_TAG }}
          token: ${{ secrets.CI_LIB_TOKEN }}
      - name: ci-nightly (soak-p3)
        env:
          CI_PART: soak-p3
          CI_GATE_HOST: ${{ runner.name }}
          CI_EVENT: ${{ github.event_name }}
        run: bash .ci-lib/gate/gate.sh ci-nightly

  # Engine-dependent ITs: the mutating corrective-action / flow-surgery / migration / bulk rails
  # and the seed-driven detail/timeline/snapshot ITs. Same compose harness the ci.yml matrix
  # uses (flowable-6 + postgres, port-remapped off the dev/demo stacks); the ITs' OWN datasource
  # is a Testcontainers Postgres, so the compose postgres profile is only there for parity.
  engine-its:
    runs-on: self-hosted
    if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["red","green"]'), inputs.triage-drill)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Docker Hub login (rate-limit mitigation)
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/ci-lib
        with:
          tag: ${{ env.CI_LIB_TAG }}
          token: ${{ secrets.CI_LIB_TOKEN }}
      - name: ci-nightly (engine-its)
        env:
          CI_PART: engine-its
          CI_GATE_HOST: ${{ runner.name }}
          CI_EVENT: ${{ github.event_name }}
        run: bash .ci-lib/gate/gate.sh ci-nightly

  # Supply-chain gates (Q9/issue #93, path-filtered PRs in #446). The steps live in
  # .github/actions/supply-chain so this job's name stays `supply-chain` (CI dashboard).
  # A fresh CVE must not redden unrelated PRs; PRs that touch a dependency or image input
  # run the same action from supply-chain-pr.yml. A red run upserts one advisory issue
  # (#447); a green run closes it.
  #
  # Trivy DB caching: aquasecurity/trivy-action@v0.36.0 (pinned in the action) already
  # restores/saves the Trivy DB via actions/cache, keyed on the UTC date. Do not add a
  # second cache step. Run 30207549362's timeout was a cold DB pull, not a missing cache.
  supply-chain:
    runs-on: self-hosted
    if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["red","green"]'), inputs.triage-drill)
    permissions:
      contents: read
      issues: write
      actions: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/supply-chain
        with:
          image-tag: scan-${{ github.run_id }}
          file-issue: "true"
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  # Synthetic red/green for #447. Does not build images. Default dispatch (off) skips this job.
  supply-chain-triage-drill:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["red","green"]'), inputs.triage-drill)
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: ./.github/actions/ci-lib
        with:
          tag: ${{ env.CI_LIB_TAG }}
          token: ${{ secrets.CI_LIB_TOKEN }}
      - name: ci-nightly (supply-chain-triage-drill)
        env:
          CI_PART: supply-chain-triage-drill
          CI_GATE_HOST: ${{ runner.name }}
          CI_EVENT: ${{ github.event_name }}
          CI_TRIAGE_DRILL: ${{ inputs.triage-drill }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .ci-lib/gate/gate.sh ci-nightly

  perf-p1:
    runs-on: self-hosted
    if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["red","green"]'), inputs.triage-drill)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Docker Hub login (rate-limit mitigation)
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/ci-lib
        with:
          tag: ${{ env.CI_LIB_TAG }}
          token: ${{ secrets.CI_LIB_TOKEN }}
      - name: ci-nightly (perf-p1)
        env:
          CI_PART: perf-p1
          CI_GATE_HOST: ${{ runner.name }}
          CI_EVENT: ${{ github.event_name }}
        run: bash .ci-lib/gate/gate.sh ci-nightly
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-summary-p1
          path: /tmp/k6-summary-p1.json
          retention-days: 90
          if-no-files-found: warn

  # Real-stack UI smoke (issue #466, TEST-STRATEGY §12): Playwright → Vite → BFF jar → the
  # compose engines, with NO page.route — the only automated test that drives UI → BFF → engine.
  # Same harness steps as engine-its (compose flowable-6 + postgres, smoke-test, seed.sh) and the
  # same background-jar shape as perf-p1. The suite's global setup starts its OWN fixtures over
  # engine REST under a run-unique business-key prefix and every mutating arc filters on it.
  # Chromium is the runner image's baked Playwright browser (docker/ci-runner/Dockerfile
  # PLAYWRIGHT_VERSION, in lockstep with frontend/package.json); Vite is the config's webServer.
  e2e-real:
    runs-on: self-hosted
    if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["red","green"]'), inputs.triage-drill)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Docker Hub login (rate-limit mitigation)
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/ci-lib
        with:
          tag: ${{ env.CI_LIB_TAG }}
          token: ${{ secrets.CI_LIB_TOKEN }}
      - name: ci-nightly (e2e-real)
        env:
          CI_PART: e2e-real
          CI_GATE_HOST: ${{ runner.name }}
          CI_EVENT: ${{ github.event_name }}
        run: bash .ci-lib/gate/gate.sh ci-nightly
      - name: Upload the HTML report, traces and BFF log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-real
          path: |
            frontend/playwright-report/real/
            frontend/test-results/real/
            ${{ runner.temp }}/bff-e2e.log
          retention-days: 14
