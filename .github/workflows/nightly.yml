# Nightly full integration suite (Q2 — IMPROVEMENT-PLAN-2026-07 P0 #5). The PR merge gate
# (ci.yml) runs 16 read-oriented engine ITs; the zero-flake doctrine keeps the mutating,
# audit-integrity, DB-CRUD and Keycloak ITs off the per-PR path. This workflow runs those
# 27 local-only ITs once a night (and on demand) so a regression in a corrective-action rail,
# the fail-closed audit chain, four-eyes governance, registry reload, OIDC resolution or the
# incident-ledger substrate (#294) is caught within a day instead of at the next manual local
# run.
#
# NOT merge-blocking: a red nightly is triaged in the morning routine, not a push gate.
# Runs on the same single self-hosted runner (docker/ci-runner) — serialized after any PR run.
# Trigger manually to shake it out: Actions → nightly → Run workflow (workflow_dispatch).
name: nightly

on:
  schedule:
    # 02:17 UTC daily — deliberately NOT top-of-hour: GitHub's scheduler load (and thus its
    # documented drop/skip of schedule triggers) clusters at :00, which is what skipped this
    # cron on 2026-07-22 (issue #290). nightly-watchdog.yml recovers a miss regardless.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      triage-drill:
        description: "off runs the suite. red/green only upserts the advisory issue (#447) and skips every other job."
        type: choice
        options: [off, red, green]
        default: off

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Self-provisioning ITs: each spins its own Postgres 16 / Keycloak via Testcontainers
  # (@DynamicPropertySource) — no compose engine, just the Docker socket the runner already
  # mounts. Audit partition/retention/roles + fail-closed, shared/team views + governance,
  # view store, mapping store + access-admin CRUD, registry store/reload, and the real-Keycloak
  # OIDC resolver IT.
  container-its:
    runs-on: self-hosted
    if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["red","green"]'), inputs.triage-drill)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Mitigates Docker Hub 429s on the shared NAT pool; skips cleanly when secrets are absent.
      - name: Docker Hub login (rate-limit mitigation)
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Rootless-DinD slots keep the job daemon's socket at /run/user/<uid>/docker.sock,
      # not /var/run/docker.sock — Testcontainers' Ryuk mounts the latter, gets an empty
      # directory, and dies before it can be inspected (404). Self-detecting and a no-op on
      # host-socket slots; see the script header for the measurement.
      - name: Point Testcontainers' Ryuk at the real socket on rootless slots
        run: bash scripts/ci-testcontainers-socket.sh >> "$GITHUB_ENV"
      - name: Container ITs (Testcontainers — Postgres / Keycloak, no compose engine)
        working-directory: backend
        run: >-
          mvn -B verify -Dskip.surefire.tests=true
          -Dit.test=AuditRoleGrantsIT,AuditPartitionCarveIT,AuditPartitionMaintainerIT,AuditRetentionPurgeIT,AuditRetentionPurgerIT,AuditIntegrityIT,SharedViewIT,SharedViewFailClosedIT,SharedViewGovernanceIT,ViewStoreIT,AccessMappingAdminDbIT,MappingStoreDbIT,EngineRegistryStoreIT,EngineRegistryReloadIT,OidcKeycloakIT,IncidentLedgerIT

  # R-TEST-05 P2 (issue #299, TEST-STRATEGY.md §7): 50k-row DLQ vs dlq-scan-cap, at the
  # documented operating scale — see docs/TRACEABILITY-MATRIX.md §A (R-TEST-05 row). Fully
  # self-contained: DlqScanCapVolumeIT boots an in-process JDK HttpServer stub engine
  # (io.inspector.support.StubFlowableEngine, its own ephemeral port) instead of a compose
  # engine, so this job needs no docker socket, no port-block resolution, and can never
  # collide with a concurrent PR/nightly job's slot (the #163/#288 port-squatting class of
  # flake this repo has hit before on compose-backed jobs). Genuinely independent of every
  # other nightly job — a red run here never blocks or queues behind the engine matrix.
  # Distinct name from `perf-p1` on purpose (that job is R-NFR-02/P4, a latency SLA against
  # healthy engines — TEST-STRATEGY's P1/P2/P4 ordinals are NOT incident-severity tiers;
  # see the naming-collision note on issue #298).
  dlq-scan-cap-p2:
    runs-on: self-hosted
    if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["red","green"]'), inputs.triage-drill)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: R-TEST-05 P2 — 50k-row DLQ scan-cap volume suite (docker-free)
        working-directory: backend
        run: mvn -B verify -Dskip.surefire.tests=true -Dit.test=DlqScanCapVolumeIT

  # R-TEST-05 P1 (issue #298, TEST-STRATEGY.md §7): "10 stub engines, 3 slow, 2 timing out" —
  # partial-failure fan-out do-no-harm. Same docker-free, self-contained shape as
  # dlq-scan-cap-p2 above (extends the SAME StubFlowableEngine foundation, io.inspector.support,
  # that job's PR #322 built as a reusable base): 10 in-process JDK HttpServer stub engines on
  # their own ephemeral ports, no compose stack, no port-block resolution, no collision with a
  # concurrent PR/nightly job's slot. Genuinely independent of every other nightly job.
  # Distinct name from BOTH `perf-p1` and `dlq-scan-cap-p2` on purpose — TEST-STRATEGY's P1/P2/P4
  # are ordinals in its performance-scenario catalog, not incident-severity tiers (`perf-p1` is
  # actually P4, R-NFR-02, a latency SLA against 5 HEALTHY engines — the naming-collision note
  # on issue #298).
  fanout-partial-failure-p1:
    runs-on: self-hosted
    if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["red","green"]'), inputs.triage-drill)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: R-TEST-05 P1 — 10-stub-engine partial-failure fan-out suite (docker-free)
        working-directory: backend
        run: mvn -B verify -Dskip.surefire.tests=true -Dit.test=FanoutPartialFailureIT

  # Engine-dependent ITs: the mutating corrective-action / flow-surgery / migration / bulk rails
  # and the seed-driven detail/timeline/snapshot ITs. Same compose harness the ci.yml matrix
  # uses (flowable-6 + postgres, port-remapped off the dev/demo stacks); the ITs' OWN datasource
  # is a Testcontainers Postgres, so the compose postgres profile is only there for parity.
  engine-its:
    runs-on: self-hosted
    if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["red","green"]'), inputs.triage-drill)
    timeout-minutes: 40
    env:
      COMPOSE_PROFILES: "flowable-6,postgres"
      CI_PROJECT: pi-ci-nightly-6
    steps:
      - uses: actions/checkout@v4
      # Runner slots (docker/ci-runner/docker-compose.yml) carry a disjoint port block as
      # container env so this job uses its ACTUAL slot's ports, never a hardcoded literal
      # that may belong to a DIFFERENT slot a concurrent ci.yml PR job is using at the same
      # time (#163 — this job used to hardcode slot-1's literal values unconditionally,
      # regardless of which slot actually ran it). Resolved the same way ci.yml's
      # "integration" job does; slot-1 values are the fallback for a slot-less runner.
      # scripts/free-port.sh additionally double-checks each port is actually free on THIS
      # host and falls back within the slot's own band otherwise (#163/#288 — a slot's
      # fixed port can end up permanently squatted by something unrelated; this makes that
      # self-healing instead of needing a manual reassignment).
      - name: Resolve the slot port namespace
        run: |
          {
            a=$(scripts/free-port.sh "${PI_ENGINE_A_PORT:-8691}" 20)
            b=$(scripts/free-port.sh "${PI_ENGINE_B_PORT:-8692}" 20 "$a")
            pg=$(scripts/free-port.sh "${PI_PG_PORT:-5435}" 5)
            echo "PI_ENGINE_A_PORT=$a"
            echo "PI_ENGINE_B_PORT=$b"
            echo "PI_PG_PORT=$pg"
            echo "INSPECTOR_DB_URL=jdbc:postgresql://localhost:${pg}/inspector"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Docker Hub login (rate-limit mitigation)
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pre-clean CI harness residue (scoped to $CI_PROJECT)
        run: docker compose -p "$CI_PROJECT" -f docker/docker-compose.dev.yml down -v --remove-orphans || true
      - name: Boot harness (flowable-6 + postgres)
        run: docker compose -p "$CI_PROJECT" -f docker/docker-compose.dev.yml up -d
      - name: Wait for engines and postgres (bounded)
        run: bash docker/smoke-test.sh flowable-6
      - name: Seed demo processes (REST-only, idempotent)
        run: bash docker/seed.sh --profile flowable-6
      # Rootless-DinD slots keep the job daemon's socket at /run/user/<uid>/docker.sock,
      # not /var/run/docker.sock — Testcontainers' Ryuk mounts the latter, gets an empty
      # directory, and dies before it can be inspected (404). Self-detecting and a no-op on
      # host-socket slots; see the script header for the measurement.
      - name: Point Testcontainers' Ryuk at the real socket on rootless slots
        run: bash scripts/ci-testcontainers-socket.sh >> "$GITHUB_ENV"
      - name: Engine ITs (failsafe)
        working-directory: backend
        run: >-
          mvn -B verify -Dskip.surefire.tests=true
          -Dit.test=CorrectiveActionIT,CmmnCorrectiveActionIT,FailClosedAuditIT,FlowSurgeryIT,BulkFilterIT,BulkErrorClassIT,SnapshotSamplerIT,DefinitionVersionsIT,MigrationIT,DetailResolveIT,InstanceTimelineIT,IncidentLedgerArcIT
      - name: Dump harness logs
        if: failure()
        run: docker compose -p "$CI_PROJECT" -f docker/docker-compose.dev.yml logs --no-color --timestamps
      - name: Tear down CI harness
        if: always()
        run: docker compose -p "$CI_PROJECT" -f docker/docker-compose.dev.yml down -v --remove-orphans || true

  # Supply-chain gates (Q9/issue #93, path-filtered PRs in #446). The steps live in
  # .github/actions/supply-chain so this job's name stays `supply-chain` (CI dashboard).
  # A fresh CVE must not redden unrelated PRs; PRs that touch a dependency or image input
  # run the same action from supply-chain-pr.yml. A red run upserts one advisory issue
  # (#447); a green run closes it.
  #
  # Trivy DB caching: aquasecurity/trivy-action@v0.36.0 (pinned in the action) already
  # restores/saves the Trivy DB via actions/cache, keyed on the UTC date. Do not add a
  # second cache step. Run 30207549362's timeout was a cold DB pull, not a missing cache.
  supply-chain:
    runs-on: self-hosted
    if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["red","green"]'), inputs.triage-drill)
    permissions:
      contents: read
      issues: write
      actions: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/supply-chain
        with:
          image-tag: scan-${{ github.run_id }}
          file-issue: "true"
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  # Synthetic red/green for #447. Does not build images. Default dispatch (off) skips this job.
  supply-chain-triage-drill:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["red","green"]'), inputs.triage-drill)
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Upsert the advisory issue from a synthetic result
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/supply-chain-triage.mjs --drill ${{ inputs.triage-drill }} --file-issue

  perf-p1:
    runs-on: self-hosted
    if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["red","green"]'), inputs.triage-drill)
    timeout-minutes: 45
    env:
      COMPOSE_PROFILES: "flowable-6,postgres"
      CI_PROJECT: pi-ci-nightly-perf
    steps:
      - uses: actions/checkout@v4
      # scripts/free-port.sh double-checks each port is actually free on THIS host and
      # falls back within this job's own band otherwise (#163/#288 — a fixed port can end
      # up permanently squatted by something unrelated; this makes that self-healing
      # instead of needing a manual reassignment).
      - name: Resolve the slot port namespace
        run: |
          {
            a=$(scripts/free-port.sh "${PI_ENGINE_A_PORT:-8695}" 20)
            b=$(scripts/free-port.sh "${PI_ENGINE_B_PORT:-8696}" 20 "$a")
            pg=$(scripts/free-port.sh "${PI_PG_PORT:-5436}" 5)
            bff=$(scripts/free-port.sh "${PI_BFF_PORT:-8697}" 20)
            echo "PI_ENGINE_A_PORT=$a"
            echo "PI_ENGINE_B_PORT=$b"
            echo "PI_PG_PORT=$pg"
            echo "PI_BFF_PORT=$bff"
            echo "INSPECTOR_DB_URL=jdbc:postgresql://localhost:${pg}/inspector"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Docker Hub login (rate-limit mitigation)
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pre-clean CI harness residue (scoped to $CI_PROJECT)
        run: docker compose -p "$CI_PROJECT" -f docker/docker-compose.dev.yml down -v --remove-orphans || true
      - name: Boot harness (flowable-6 + postgres)
        run: docker compose -p "$CI_PROJECT" -f docker/docker-compose.dev.yml up -d
      - name: Wait for engines and postgres (bounded)
        run: bash docker/smoke-test.sh flowable-6
      # Full FIX-REF-01 scale (default --scale 1.0): ~27k starts/engine, empirically ~90s/
      # engine at 32 workers against this harness — comfortably inside the timeout above.
      # Explicit engine URLs: the flowable-6 profile only brings up A+B, and the script's
      # own no-args default additionally probes the (here, absent) engine-7/legacy ports.
      - name: Seed FIX-REF-01 reference dataset (REST-only, idempotent)
        run: >-
          python3 docker/seed-reference.py
          "http://localhost:${PI_ENGINE_A_PORT}/flowable-rest/service"
          "http://localhost:${PI_ENGINE_B_PORT}/flowable-rest/service"
      - name: Build BFF jar
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Boot BFF in the background, pointed at the seeded engines
        working-directory: backend
        env:
          INSPECTOR_ENGINE_A_BASE_URL: http://localhost:${{ env.PI_ENGINE_A_PORT }}/flowable-rest/service
          INSPECTOR_ENGINE_B_BASE_URL: http://localhost:${{ env.PI_ENGINE_B_PORT }}/flowable-rest/service
          ENGINE_A_PASSWORD: test
          ENGINE_B_PASSWORD: test
          SERVER_PORT: ${{ env.PI_BFF_PORT }}
        run: |
          JAR=$(ls target/*.jar | head -1)
          nohup java -jar "$JAR" > /tmp/bff-perf.log 2>&1 &
          echo $! > /tmp/bff-perf.pid
      - name: Wait for /v3/api-docs (bounded)
        run: |
          for _ in $(seq 1 90); do
            curl -fsS "http://localhost:${PI_BFF_PORT}/v3/api-docs" > /dev/null && exit 0
            sleep 2
          done
          echo "::error::BFF did not serve /v3/api-docs within 180s"
          tail -200 /tmp/bff-perf.log
          exit 1
      # k6 runs as a BINARY on the runner, not in a container, because the BFF it measures is
      # itself a plain `java -jar` ON the runner. A containerised k6 has to cross into the
      # daemon's network namespace, and on the rootless-dind slots (hp02, rebuilt 2026-09-02)
      # there is no route back — measured on nightly #91, which probed all three plausible
      # addresses and was refused by each:
      #   not reachable: http://localhost:8386 / http://host.docker.internal:8386 / http://172.17.0.1:8386
      #   Daemon: 28.5.2 security=["name=seccomp,profile=builtin","name=rootless","name=cgroupns"]
      # So this is not an addressing problem to be solved with a better guess; the hop itself
      # has to go. Runner labels are identical across hosts, so the job cannot be pinned to a
      # host-socket slot instead.
      #
      # Same k6 version the image shipped (v2.1.0 — `k6 version` confirms the identical
      # commit), so perf-scenario-p1.js's calibrated thresholds measure what they did before;
      # it also drops container networking from the CLIENT side of a latency measurement,
      # which is strictly less noise between k6 and the BFF.
      - name: Install k6 (pinned, checksum-verified)
        run: |
          set -euo pipefail
          ver=2.1.0
          sha=295d961ebfca306f295f1133068dcd403a8171c87f387928f5f30b0fbcff858a
          curl -fsSL "https://github.com/grafana/k6/releases/download/v${ver}/k6-v${ver}-linux-amd64.tar.gz" -o /tmp/k6.tgz
          echo "${sha}  /tmp/k6.tgz" | sha256sum -c -
          tar xzf /tmp/k6.tgz -C /tmp
          install -m 0755 "/tmp/k6-v${ver}-linux-amd64/k6" /tmp/k6
          /tmp/k6 version
      # The dev viewer/dev credentials are the k6 script's own defaults (SecurityConfig, !oidc).
      - name: k6 — P1 latency budgets (SPEC §2, R-NFR-01/02)
        env:
          BASE_URL: http://localhost:${{ env.PI_BFF_PORT }}
        run: /tmp/k6 run --summary-export=/tmp/k6-summary-p1.json scripts/perf-scenario-p1.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-summary-p1
          path: /tmp/k6-summary-p1.json
          retention-days: 90
          if-no-files-found: warn
      - name: Dump BFF log
        if: failure()
        run: tail -200 /tmp/bff-perf.log || true
      - name: Reap the background BFF
        if: always()
        run: kill "$(cat /tmp/bff-perf.pid 2>/dev/null)" 2>/dev/null || true
      - name: Dump harness logs
        if: failure()
        run: docker compose -p "$CI_PROJECT" -f docker/docker-compose.dev.yml logs --no-color --timestamps
      - name: Tear down CI harness
        if: always()
        run: docker compose -p "$CI_PROJECT" -f docker/docker-compose.dev.yml down -v --remove-orphans || true
