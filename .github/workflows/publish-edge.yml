# Continuous builds (OPERATIONS §5): after every GREEN merge-queue batch, publish the two
# shipping images as :edge + :sha-<short7> to BOTH ghcr.io and Docker Hub. Triggered by
# workflow_run — not push — so a red batch never ships an image (the green-main doctrine
# applied to publishing). Consumers pinning a released version are never moved by these
# tags; versioned releases are release.yml / cut-release.yml.
#
# Since the merge queue (ci.yml has no push trigger for main), the green `ci` run is the one on
# the `mq/**` batch branch; the queue then fast-forwards main to that same commit. This job
# waits until the commit is on main before it publishes, so :edge never names a commit main
# does not contain. `main` stays in the branch filter for a ci run that does report on main.
#
# workflow_dispatch (on main only) publishes the current main head by hand. It exists for a
# landing that did not go through the queue (the admin bypass, RUNBOOK §0): no batch ran, so
# nothing else would build the image. The operator who dispatches it vouches for that commit;
# the heavy checks did not gate it.
# Requires the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repo secrets (see release.yml header).
name: publish-edge

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main, 'mq/**']
  workflow_dispatch:

permissions:
  packages: write

# A newer green main supersedes an in-flight edge build.
concurrency:
  group: publish-edge
  cancel-in-progress: true

jobs:
  edge:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      # The commit the green ci run actually validated — NOT github.sha (which is the
      # default-branch head at event-delivery time and can already be newer). On a manual
      # dispatch there is no triggering run, and github.sha is the dispatched main head.
      GREEN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.GREEN_SHA }}
      - name: Wait until the green commit is on main
        if: github.event_name == 'workflow_run'
        run: |
          # The queue fast-forwards main right after the batch run turns green. Bounded wait:
          # 30 tries x 10 s. A batch that never reaches main is not published.
          for _ in $(seq 1 30); do
            git fetch --quiet --depth=200 origin main
            if git merge-base --is-ancestor "$GREEN_SHA" FETCH_HEAD 2>/dev/null; then
              echo "$GREEN_SHA is on main"; exit 0
            fi
            sleep 10
          done
          echo "::error::$GREEN_SHA did not reach main within 5 minutes; not publishing"
          exit 1
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Short SHA
        id: src
        run: echo "short=$(cut -c1-7 <<< "$GREEN_SHA")" >> "$GITHUB_OUTPUT"

      - name: BFF image tags
        id: meta-bff
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}-bff
            docker.io/x3kcl/process-inspector-bff
          tags: |
            type=raw,value=edge
            type=raw,value=sha-${{ steps.src.outputs.short }}
      - name: Build + push BFF image
        id: build-bff
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta-bff.outputs.tags }}
          labels: ${{ steps.meta-bff.outputs.labels }}
          cache-from: type=gha
          # Keep the SHIPPING image on the same footing as the nightly-scanned one: without
          # this, a cached runtime stage would publish the very OS package set the (now
          # uncached) Trivy gate just certified as fixed — a green gate over a different
          # artifact than the one users pull. See the Dockerfile's `runtime` stage comment.
          no-cache-filters: runtime
          # Same GHA-cache-export-slowness that timed out ci.yml's docker job 3x today —
          # mode=min + ignore-error=true so a slow/broken cache service can't block a push.
          cache-to: type=gha,mode=min,ignore-error=true

      - name: Web image tags
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}-web
            docker.io/x3kcl/process-inspector-web
          tags: |
            type=raw,value=edge
            type=raw,value=sha-${{ steps.src.outputs.short }}
      - name: Build + push web image
        id: build-web
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          # Same rule as the BFF image: without this a cached runtime stage would publish
          # the very OS package set the nightly web-image gate just certified as fixed
          # (#409). See frontend/Dockerfile's `runtime` stage comment.
          no-cache-filters: runtime
          # Same GHA-cache-export-slowness that timed out ci.yml's docker job 3x today —
          # mode=min + ignore-error=true so a slow/broken cache service can't block a push.
          cache-to: type=gha,mode=min,ignore-error=true

      - name: Record digests (issue #92 — always attributable to a SHA, never a floating tag)
        run: |
          {
            echo "### edge / sha-${{ steps.src.outputs.short }} image digests ($GREEN_SHA)"
            echo "- BFF: \`ghcr.io/${{ github.repository }}-bff@${{ steps.build-bff.outputs.digest }}\`"
            echo "- web: \`ghcr.io/${{ github.repository }}-web@${{ steps.build-web.outputs.digest }}\`"
            echo
            echo "Pin the demo deploy to these with \`docker/deploy-demo.sh edge\` — see docker/DEMO-DEPLOY.md."
          } | tee -a "$GITHUB_STEP_SUMMARY"
