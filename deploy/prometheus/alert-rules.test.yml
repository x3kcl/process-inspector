# promtool test rules (#472). Covers one existing rule and the new engine-unreachable rule;
# #624 adds the SSE pair (disconnects alone never fire SseEmitterErrorsSpiking) and
# SseDisconnectChurn (a proxy cutting streams fires; ordinary tab closes do not).
rule_files:
  - alert-rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="process-inspector"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: InspectorDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: process-inspector
            exp_annotations:
              summary: "process-inspector is unreachable (liveness)"
              runbook: "RUNBOOK.md §1"

  - interval: 1m
    input_series:
      - series: 'resilience4j_circuitbreaker_state{name="orders",state="open"}'
        values: '1+0x6'
    alert_rule_test:
      - eval_time: 5m
        alertname: EngineUnreachable
        exp_alerts:
          - exp_labels:
              severity: warning
              name: orders
              state: open
            exp_annotations:
              summary: "One engine circuit breaker has been open for 5 minutes"
              runbook: "RUNBOOK.md §7"

  - interval: 1m
    input_series:
      - series: oidc_login_failures_total
        values: 0+1x20
    alert_rule_test:
      - eval_time: 15m
        alertname: OidcLoginFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "OIDC logins are failing"
              runbook: "RUNBOOK.md §7"

  - interval: 1m
    input_series:
      - series: snapshot_last_success_seconds
        values: 0+0x15
    alert_rule_test:
      - eval_time: 9m
        alertname: SnapshotSamplerStalled
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The snapshot sampler has not succeeded for over 3 minutes"
              runbook: "RUNBOOK.md §7"

  - interval: 1m
    input_series:
      - series: audit_retention_purge_failures_total
        values: 0 0 1+0x12
    alert_rule_test:
      - eval_time: 10m
        alertname: AuditRetentionPurgeFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The audit retention purge aborted or was refused"
              runbook: "RUNBOOK.md §7"

  # #624: forty tab closes in five minutes are disconnects, not emitter errors — no alert.
  - interval: 1m
    input_series:
      - series: 'sse_emitter_disconnects_total'
        values: '0+8x6'
      - series: 'sse_emitter_errors_total'
        values: '0+0x6'
    alert_rule_test:
      - eval_time: 5m
        alertname: SseEmitterErrorsSpiking
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'sse_emitter_errors_total'
        values: '0+2x6'
    alert_rule_test:
      - eval_time: 5m
        alertname: SseEmitterErrorsSpiking
        exp_alerts:
          - exp_annotations:
              summary: "SSE sends failing inside the BFF — affected clients are degrading to polling"
              runbook: "RUNBOOK.md §7 — a BFF-side send failure, not a proxy or a closed tab; not user-facing-critical"
            exp_labels:
              severity: warning

  # #624: a proxy cutting each of 5 streams every ~2.5 min — 30 disconnects per 15 min against
  # a ceiling of 3 x 5 — fires once sustained for 10 min.
  - interval: 1m
    input_series:
      - series: 'sse_emitters_active'
        values: '5x40'
      - series: 'sse_emitter_disconnects_total'
        values: '0+2x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: SseDisconnectChurn
        exp_alerts:
          - exp_annotations:
              summary: "SSE streams are being cut and reconnecting in a loop"
              runbook: "RUNBOOK.md §7 — usually a reverse-proxy timeout or buffering misconfig after a deploy; not user-facing-critical"
            exp_labels:
              severity: warning

  # #624: 20 live streams and a tab closing every minute (15 per 15 min, ceiling 60) — no alert.
  - interval: 1m
    input_series:
      - series: 'sse_emitters_active'
        values: '20x40'
      - series: 'sse_emitter_disconnects_total'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: SseDisconnectChurn
        exp_alerts: []
